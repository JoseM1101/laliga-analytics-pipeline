models:
  - name: int_matches__pivoted_by_team
    columns:
      - name: match_team_key
        tests:
          - unique
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: points
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
                quote: false
              config:
                where: "status = 'FINISHED'"
