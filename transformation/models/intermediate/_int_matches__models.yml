models:
  - name: int_matches__pivoted_by_team
    columns:
      - name: match_team_key
        tests:
          - unique
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: points
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
                quote: false
              config:
                where: "status = 'FINISHED'"
  - name: int_matches__team_stats
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_id
              - team_id
    columns:
      - name: season_id
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
